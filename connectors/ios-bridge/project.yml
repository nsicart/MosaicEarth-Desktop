name: MosaicEarthBridge
options:
  bundleIdPrefix: app.mosaicearth
  deploymentTarget:
    iOS: "16.0"
  generateEmptyDirectories: true

targets:
  MosaicEarthBridgeKit:
    type: framework
    platform: iOS
    sources:
      - Sources/MosaicEarthBridgeKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mosaicearth.bridge.kit
        GENERATE_INFOPLIST_FILE: YES

  MosaicEarthBridge:
    type: application
    platform: iOS
    sources:
      - Sources/MosaicEarthBridgeApp
    dependencies:
      - target: MosaicEarthBridgeKit
      - target: MosaicEarthShareExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mosaicearth.bridge
        MARKETING_VERSION: "0.4.0"
        CURRENT_PROJECT_VERSION: "4"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "ME Bridge"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait

  MosaicEarthShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/MosaicEarthShareExtension
        excludes:
          - Info.plist
    info:
      path: Sources/MosaicEarthShareExtension/Info.plist
    dependencies:
      - target: MosaicEarthBridgeKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mosaicearth.bridge.share
        MARKETING_VERSION: "0.4.0"
        CURRENT_PROJECT_VERSION: "4"
