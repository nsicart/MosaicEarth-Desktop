<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-eval'; worker-src 'self' blob:; img-src 'self' data: blob:">
<meta name="workspace-token" content="__WORKSPACE_TOKEN__">
<title>MosaicEarth Desktop</title>
<link rel="stylesheet" href="/cesium/Widgets/widgets.css">
<link rel="stylesheet" href="/style.css">
<script defer src="/cesium/Cesium.js"></script>
<script defer src="/desktop.js"></script>
</head>
<body>
<header><h1>MosaicEarth Desktop</h1><p>Local projects</p></header>
<main>
<aside>
<form id="create"><label>Project name <input id="name" required maxlength="120"></label> <button>Create</button></form>
<nav id="projects" aria-label="Projects"></nav>
<details><summary>MosaicEarth Cloud</summary>
<form id="cloudLogin"><p><label>Email <input id="cloudEmail" type="email" required autocomplete="username"></label></p>
<p><label>Password <input id="cloudPassword" type="password" required autocomplete="current-password"></label></p>
<button>Sign in</button></form><button id="cloudLogout" hidden>Sign out</button><p id="cloudState" role="status"></p>
</details>
</aside>
<section>
<h2 id="title">Select a project</h2>
<div id="actions" hidden>
<p><label>Photos <input id="photos" type="file" accept="image/jpeg,image/png,image/tiff" multiple></label> <button id="uploadPhotos">Import photos</button></p>
<p><label>GeoTIFF <input id="raster" type="file" accept=".tif,.tiff"></label> <button id="uploadRaster">Import and preview</button></p>
<p><button id="odx">Run photogrammetry</button> <button id="gaussian">Train Gaussian on CPU</button></p>
<p><button id="syncProject" disabled>Copy project name to MyEarth</button></p>
<p id="state" role="status"></p>
<p id="files"></p>
</div>
<div id="viewer" aria-label="Offline Cesium map"></div>
<img id="rasterPreview" alt="Imported local raster preview" hidden>
</section>
</main>
</body>
</html>
