name: Windows installer
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  windows-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify source and build browser runtime
        shell: bash
        run: ./scripts/fetch-cesium.sh
      - name: Compile unsigned installer
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MosaicEarth-Desktop-Windows-x64
          path: |
            installers/*.exe
            installers/SHA256SUMS.windows
          if-no-files-found: error
